name: Enviar partes semanales a Soraya

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Volver a enviar la última semana completa"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-reports-soraya
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crear y enviar el Excel semanal
        run: pnpm run send-weekly
        env:
          FIREBASE_DATABASE_SECRET: ${{ secrets.FIREBASE_DATABASE_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: soraya@transporteserdella.com
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
